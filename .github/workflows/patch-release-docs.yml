name: Patch TaskRuntime release docs

on:
  push:
    paths:
      - ".github/workflows/patch-release-docs.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          path = Path("docs/task-runtime.md")
          docs = path.read_text(encoding="utf-8")

          docs, count = re.subn(
              r"(Current version:\n\n```text\n)\d+\.\d+\.\d+(\n```)",
              rf"\g<1>{version}\2",
              docs,
              count=1,
          )
          if count != 1:
              raise RuntimeError("could not update documented version")

          if "## Release status" not in docs:
              marker = f"```text\n{version}\n```\n"
              docs = docs.replace(
                  marker,
                  marker
                  + "\n## Release status\n\n"
                  + f"Version {version} is the first supported public release. "
                  + "TaskRuntime follows semantic versioning and keeps compatible "
                  + "APIs stable within the same major version.\n",
                  1,
              )

          if "task-runtime-stress-test.server.luau" not in docs:
              docs = docs.replace(
                  "- `scripts/tests/task-runtime-test.server.luau`: Creator self-test\n",
                  "- `scripts/tests/task-runtime-test.server.luau`: Creator self-test\n"
                  "- `scripts/tests/task-runtime-stress-test.server.luau`: optional Creator stress test\n",
                  1,
              )
              marker = "Remove or disable the test script after verification.\n"
              docs = docs.replace(
                  marker,
                  marker
                  + "\nRun the stress test separately with the integration test disabled:\n\n"
                  + "```text\n"
                  + "scripts/tests/task-runtime-stress-test.server.luau\n"
                  + "```\n\n"
                  + "A successful run prints:\n\n"
                  + "```text\n"
                  + "TaskRuntime stress test passed\n"
                  + "```\n\n"
                  + "The stress test exercises bounded concurrency, result ordering, "
                  + "mass cancellation, deadline cleanup, and active-task release.\n",
                  1,
              )

          path.write_text(docs, encoding="utf-8", newline="\n")
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/patch-release-docs.yml

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/task-runtime.md .github/workflows/patch-release-docs.yml
          git commit -m "Update TaskRuntime release documentation"
          git push origin master
