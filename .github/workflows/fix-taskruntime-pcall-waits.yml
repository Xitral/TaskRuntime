name: Fix TaskRuntime waits inside nested pcall

on:
  push:
    paths:
      - ".github/workflows/fix-taskruntime-pcall-waits.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch TaskRuntime
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runtime_path = Path("scripts/modules/TaskRuntime.luau")
          runtime = runtime_path.read_text(encoding="utf-8")

          runtime = replace_once(
              runtime,
              'TaskRuntime.VERSION = "3.0.2"',
              'TaskRuntime.VERSION = "3.0.3"',
              "version",
          )

          runtime = replace_once(
              runtime,
              '''\tif scheduler == nil then
          \t\treturn {
          \t\t\tnow = function()''',
              '''\tif scheduler == nil then
          \t\treturn {
          \t\t\tsupportsParking = false,
          \t\t\tnow = function()''',
              "default scheduler parking capability",
          )

          runtime = replace_once(
              runtime,
              '''\tif type(scheduler.now) == "function" and type(scheduler.spawn) == "function" and type(scheduler.sleep) == "function" then
          \t\treturn {
          \t\t\tnow = scheduler.now,''',
              '''\tif type(scheduler.now) == "function" and type(scheduler.spawn) == "function" and type(scheduler.sleep) == "function" then
          \t\treturn {
          \t\t\tsupportsParking = scheduler.supportsParking == true,
          \t\t\tnow = scheduler.now,''',
              "lowercase scheduler parking capability",
          )

          runtime = replace_once(
              runtime,
              '''\tif type(scheduler.Now) == "function" and type(scheduler.Spawn) == "function" and type(scheduler.Sleep) == "function" then
          \t\treturn {
          \t\t\tnow = function()''',
              '''\tif type(scheduler.Now) == "function" and type(scheduler.Spawn) == "function" and type(scheduler.Sleep) == "function" then
          \t\treturn {
          \t\t\tsupportsParking = scheduler.SupportsParking == true,
          \t\t\tnow = function()''',
              "method scheduler parking capability",
          )

          runtime = replace_once(
              runtime,
              '''\t-- Polytoria runs pcall callbacks in an engine-managed coroutine. A raw
          \t-- coroutine.yield inside that callback is treated as the callback returning,
          \t-- so waits inside TaskRuntime tasks must yield through the engine scheduler.
          \tif self:_GetCurrentTask() == nil and isYieldable() then''',
              '''\t-- Raw coroutine parking is only safe for schedulers that explicitly support it.
          \t-- Polytoria's engine-managed pcall creates nested coroutines, so the default
          \t-- scheduler uses wait(0) polling instead of allowing a raw yield to escape.
          \tif self._scheduler.supportsParking and isYieldable() then''',
              "scheduler-safe await selection",
          )

          runtime = replace_once(
              runtime,
              '''function TestScheduler.new(startTime)
          \treturn setmetatable({
          \t\t_time = startTime or 0,''',
              '''function TestScheduler.new(startTime)
          \treturn setmetatable({
          \t\tSupportsParking = true,
          \t\t_time = startTime or 0,''',
              "test scheduler parking support",
          )

          runtime_path.write_text(runtime, encoding="utf-8")

          test_path = Path("scripts/tests/task-runtime-test.server.luau")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              '''local nestedAwaitSuccess, nestedAwaitValue = nestedAwait:Await(2)
          expect(nestedAwaitSuccess and nestedAwaitValue == "parent done", "nested await should complete the parent")

          -- all, settle, race, and any use completion callbacks rather than frame polling.''',
              '''local nestedAwaitSuccess, nestedAwaitValue = nestedAwait:Await(2)
          expect(nestedAwaitSuccess and nestedAwaitValue == "parent done", "nested await should complete the parent")

          -- Polytoria pcall runs its callback in another engine-managed coroutine.
          local protectedWait = TaskRuntime.spawn(function(token)
          \tlocal succeeded, value = pcall(function()
          \t\ttoken:Wait(0.05)
          \t\treturn "protected wait done"
          \tend)
          \texpect(succeeded and value == "protected wait done", "wait inside pcall should resume normally")
          end)
          expect(protectedWait:Await(1), "protected wait task should complete")

          -- all, settle, race, and any use completion callbacks rather than frame polling.''',
              "nested pcall regression test",
          )
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-taskruntime-pcall-waits.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix waits inside nested pcall callbacks"
          git push origin master
