name: Verify TaskRuntime release readiness

on:
  push:
    paths:
      - ".github/workflows/verify-release-ready.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Compile release tools
        run: python3 -m compileall -q tools
      - name: Validate release metadata
        run: python3 tools/validate_release.py
      - name: Build and inspect release assets
        run: |
          python3 tools/build_release.py
          test -f dist/TaskRuntime.luau
          test -f dist/TaskRuntimeTypes.luau
          test -f dist/taskruntime-3.0.3.zip
          test -f dist/SHA256SUMS.txt
          unzip -t dist/taskruntime-3.0.3.zip
      - name: Remove one-time workflow
        run: rm -f .github/workflows/verify-release-ready.yml
      - name: Record successful verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-release-ready.yml
          git commit -m "Verify TaskRuntime release tooling"
          git push origin master
