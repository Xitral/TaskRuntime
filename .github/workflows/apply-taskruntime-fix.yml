name: Apply TaskRuntime scheduler fix

on:
  push:
    paths:
      - ".github/workflows/apply-taskruntime-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TaskRuntime
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runtime_path = Path("scripts/modules/TaskRuntime.luau")
          runtime = runtime_path.read_text(encoding="utf-8")

          runtime = replace_once(
              runtime,
              'TaskRuntime.VERSION = "3.0.0"',
              'TaskRuntime.VERSION = "3.0.1"',
              "version",
          )

          runtime = replace_once(
              runtime,
              '''\tlocal thread = coroutine and coroutine.running and coroutine.running() or nil
          \tif thread ~= nil then
          \t\tself._currentTasks[thread] = handle
          \tend
          \tlocal callResults = pack(pcall(callback, handle.Token, unpackPacked(args)))
          \tif thread ~= nil then
          \t\tself._currentTasks[thread] = nil
          \tend''',
              '''\tlocal callbackThread = nil
          \tlocal callResults = pack(pcall(function()
          \t\tcallbackThread = coroutine and coroutine.running and coroutine.running() or nil
          \t\tif callbackThread ~= nil then
          \t\t\tself._currentTasks[callbackThread] = handle
          \t\tend
          \t\treturn callback(handle.Token, unpackPacked(args))
          \tend))
          \tif callbackThread ~= nil then
          \t\tself._currentTasks[callbackThread] = nil
          \tend''',
              "task callback thread tracking",
          )

          runtime = replace_once(
              runtime,
              '''\tif isYieldable() then
          \t\tparkedThread = coroutine.running()
          \t\treturn coroutine.yield({ __taskRuntimePark = true })
          \tend

          \twhile not resolved do
          \t\tself:_Sleep(0)
          \tend''',
              '''\t-- Polytoria runs pcall callbacks in an engine-managed coroutine. A raw
          \t-- coroutine.yield inside that callback is treated as the callback returning,
          \t-- so waits inside TaskRuntime tasks must yield through the engine scheduler.
          \tif self:_GetCurrentTask() == nil and isYieldable() then
          \t\tparkedThread = coroutine.running()
          \t\treturn coroutine.yield({ __taskRuntimePark = true })
          \tend

          \twhile not resolved do
          \t\tself:_Sleep(0)
          \tend''',
              "scheduler-safe await",
          )

          runtime_path.write_text(runtime, encoding="utf-8")

          test_path = Path("scripts/tests/task-runtime-test.server.luau")
          test = test_path.read_text(encoding="utf-8")
          test = replace_once(
              test,
              '''expectEqual(retryAttempts, 3, "retry should stop after success")

          -- all, settle, race, and any use completion callbacks rather than frame polling.''',
              '''expectEqual(retryAttempts, 3, "retry should stop after success")

          -- Waiting from inside a task callback must not be mistaken for callback completion.
          local nestedAwait = TaskRuntime.spawn(function()
          \tlocal child = TaskRuntime.delay(0.05, function()
          \t\treturn "child done"
          \tend)
          \tlocal childSuccess, childValue = child:Await(1)
          \texpect(childSuccess and childValue == "child done", "task callback should await its child")
          \treturn "parent done"
          end)
          local nestedAwaitSuccess, nestedAwaitValue = nestedAwait:Await(2)
          expect(nestedAwaitSuccess and nestedAwaitValue == "parent done", "nested await should complete the parent")

          -- all, settle, race, and any use completion callbacks rather than frame polling.''',
              "nested await regression test",
          )
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/modules/TaskRuntime.luau scripts/tests/task-runtime-test.server.luau
          if ! git diff --cached --quiet; then
            git commit -m "Fix TaskRuntime waits inside task callbacks"
            git push
          fi
