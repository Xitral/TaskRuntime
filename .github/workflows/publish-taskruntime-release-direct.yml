name: Publish TaskRuntime release directly

on:
  push:
    paths:
      - ".github/workflows/publish-taskruntime-release-direct.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove one-time release workflow
        run: |
          rm -f .github/workflows/publish-taskruntime-release-direct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove direct release trigger"
          git push origin master

      - name: Validate and build final release
        run: |
          python3 tools/validate_release.py
          python3 tools/build_release.py

      - name: Create or verify release tag
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          remote_sha="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [ -z "${remote_sha}" ]; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          fi
          if [ -n "${remote_sha}" ]; then
            if [ "${remote_sha}" != "$(git rev-parse HEAD)" ]; then
              echo "Existing tag ${tag} does not point to the final release commit" >&2
              exit 1
            fi
          else
            git tag -a "${tag}" -m "TaskRuntime ${version}"
            git push origin "${tag}"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --verify-tag \
              --generate-notes \
              --title "TaskRuntime ${tag}"
          fi
