name: Publish TaskRuntime release

on:
  push:
    paths:
      - ".github/workflows/publish-taskruntime-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify release tag is new
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

      - name: Remove one-time release trigger
        run: |
          rm -f .github/workflows/publish-taskruntime-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time release trigger"
          git push origin master

      - name: Validate final release commit
        run: |
          python3 tools/validate_release.py
          python3 tools/build_release.py

      - name: Create and push release tag
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          git tag -a "${tag}" -m "TaskRuntime ${version}"
          git push origin "${tag}"
