name: Prepare TaskRuntime release

on:
  push:
    paths:
      - ".github/workflows/prepare-taskruntime-release.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Extract release files
        run: |
          base64 --decode .github/release-prep.tar.gz.b64 > /tmp/taskruntime-release-files.tar.gz
          tar -xzf /tmp/taskruntime-release-files.tar.gz -C .

      - name: Update main documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          path = Path("docs/task-runtime.md")
          docs = path.read_text(encoding="utf-8")

          docs, count = re.subn(
              r"(Current version:\n\n```text\n)\d+\.\d+\.\d+(\n```)",
              rf"\g<1>{version}\2",
              docs,
              count=1,
          )
          if count != 1:
              raise RuntimeError("could not update documented version")

          if "## Release status" not in docs:
              marker = f"```text\n{version}\n```\n"
              replacement = marker + (
                  "\n## Release status\n\n"
                  f"Version {version} is the first supported public release. "
                  "TaskRuntime follows semantic versioning and keeps compatible "
                  "APIs stable within the same major version.\n"
              )
              docs = docs.replace(marker, replacement, 1)

          if "task-runtime-stress-test.server.luau" not in docs:
              docs = docs.replace(
                  "- `scripts/tests/task-runtime-test.server.luau`: Creator self-test\n",
                  "- `scripts/tests/task-runtime-test.server.luau`: Creator self-test\n"
                  "- `scripts/tests/task-runtime-stress-test.server.luau`: optional Creator stress test\n",
                  1,
              )
              marker = "Remove or disable the test script after verification.\n"
              addition = """Remove or disable the test script after verification.

Run the stress test separately with the integration test disabled:

```text
scripts/tests/task-runtime-stress-test.server.luau
```

A successful run prints:

```text
TaskRuntime stress test passed
```

The stress test exercises bounded concurrency, result ordering, mass cancellation, deadline cleanup, and active-task release.
"""
              docs = docs.replace(marker, addition, 1)

          path.write_text(docs, encoding="utf-8", newline="\n")
          PY

      - name: Remove staging files
        run: |
          rm -f .github/release-prep.tar.gz.b64
          rm -f .github/workflows/prepare-taskruntime-release.yml

      - name: Validate prepared release
        run: |
          python3 -m compileall -q tools
          python3 tools/validate_release.py
          python3 tools/build_release.py

      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare TaskRuntime for public release"
          git push origin master
