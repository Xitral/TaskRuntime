name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  pull_request_target:
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  migrate-3-0-4:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'taskruntime-3-0-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply release migration
        run: |
          if [ -f tools/apply_3_0_4.py ]; then
            python3 tools/apply_3_0_4.py
          fi

      - name: Compile validation tools
        run: python3 -m compileall -q tools

      - name: Validate release metadata
        run: python3 tools/validate_release.py

      - name: Build release package
        run: python3 tools/build_release.py

      - name: Commit generated release source
        run: |
          if [ ! -f tools/apply_3_0_4.py ]; then
            echo 'Migration already applied.'
            exit 0
          fi

          rm -f tools/apply_3_0_4.py
          rm -f .github/workflows/apply-3-0-4.yml

          cat > .github/workflows/validate.yml <<'EOF'
          name: Validate

          on:
            push:
              branches:
                - main
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            repository:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Compile validation tools
                  run: python3 -m compileall -q tools
                - name: Validate release metadata
                  run: python3 tools/validate_release.py
                - name: Build release package
                  run: python3 tools/build_release.py
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: add Polytoria-safe callback mode'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  repository:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile validation tools
        run: python3 -m compileall -q tools
      - name: Validate release metadata
        run: python3 tools/validate_release.py
      - name: Build release package
        run: python3 tools/build_release.py
