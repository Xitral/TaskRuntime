name: Apply TaskRuntime aggregate fix

on:
  push:
    paths:
      - ".github/workflows/apply-taskruntime-aggregate-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TaskRuntime
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runtime_path = Path("scripts/modules/TaskRuntime.luau")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = replace_once(runtime, 'TaskRuntime.VERSION = "3.0.1"', 'TaskRuntime.VERSION = "3.0.2"', "version")

          runtime = replace_once(runtime, '''\tlocal function complete(values)
          \t\tif settled or aggregate:IsDone() then
          \t\t\treturn false
          \t\tend
          \t\tsettled = true
          \t\tdisconnectAll()
          \t\tself:_CompleteHandle(aggregate, values)
          \t\treturn true
          \tend
          \tlocal function fail(taskError)
          \t\tif settled or aggregate:IsDone() then
          \t\t\treturn false
          \t\tend
          \t\tsettled = true
          \t\tdisconnectAll()
          \t\tself:_FailHandle(aggregate, taskError)
          \t\treturn true
          \tend''', '''\tlocal function settle(finalize, beforeFinish)
          \t\tif settled or aggregate:IsDone() then
          \t\t\treturn false
          \t\tend
          \t\tsettled = true
          \t\tdisconnectAll()
          \t\tif beforeFinish ~= nil then
          \t\t\tlocal succeeded, effectError = pcall(beforeFinish)
          \t\t\tif not succeeded then
          \t\t\t\tself:_Warn("[TaskRuntime] aggregate pre-finish action failed: " .. tostring(effectError))
          \t\t\tend
          \t\tend
          \t\tfinalize()
          \t\treturn true
          \tend
          \tlocal function complete(values, beforeFinish)
          \t\treturn settle(function()
          \t\t\tself:_CompleteHandle(aggregate, values)
          \t\tend, beforeFinish)
          \tend
          \tlocal function fail(taskError, beforeFinish)
          \t\treturn settle(function()
          \t\t\tself:_FailHandle(aggregate, taskError)
          \t\tend, beforeFinish)
          \tend''', "aggregate settlement")

          runtime = replace_once(runtime, '''\t\t\t\tif failFast and not outcome.Success then
          \t\t\t\t\tlocal reason = outcome.Error and outcome.Error.Message or outcome.CancellationReason or outcome.Status
          \t\t\t\t\tlocal settledNow = fail(self:_MakeTaskError(aggregate, "CHILD_TASK_FAILED", "child " .. tostring(index) .. " " .. outcome.Status .. ": " .. tostring(reason), {
          \t\t\t\t\t\tCause = outcome.Error,
          \t\t\t\t\t}))
          \t\t\t\t\tif settledNow and cancelOnFailure then
          \t\t\t\t\t\tcancelRemaining(handles, index, "TaskRuntime.all child did not complete")
          \t\t\t\t\tend
          \t\t\t\t\treturn
          \t\t\t\tend''', '''\t\t\t\tif failFast and not outcome.Success then
          \t\t\t\t\tlocal reason = outcome.Error and outcome.Error.Message or outcome.CancellationReason or outcome.Status
          \t\t\t\t\tlocal beforeFinish = nil
          \t\t\t\t\tif cancelOnFailure then
          \t\t\t\t\t\tbeforeFinish = function()
          \t\t\t\t\t\t\tcancelRemaining(handles, index, "TaskRuntime.all child did not complete")
          \t\t\t\t\t\tend
          \t\t\t\t\tend
          \t\t\t\t\tfail(self:_MakeTaskError(aggregate, "CHILD_TASK_FAILED", "child " .. tostring(index) .. " " .. outcome.Status .. ": " .. tostring(reason), {
          \t\t\t\t\t\tCause = outcome.Error,
          \t\t\t\t\t}), beforeFinish)
          \t\t\t\t\treturn
          \t\t\t\tend''', "all cancellation ordering")

          runtime = replace_once(runtime, '''\t\t\t\t\tlocal outcome = completedHandle:GetOutcome()
          \t\t\t\t\tlocal settledNow = false
          \t\t\t\t\tif outcome.Success then
          \t\t\t\t\t\tlocal values = { n = (outcome.Values and outcome.Values.n or 0) + 1 }
          \t\t\t\t\t\tvalues[1] = index
          \t\t\t\t\t\tif outcome.Values ~= nil then
          \t\t\t\t\t\t\tfor valueIndex = 1, outcome.Values.n do
          \t\t\t\t\t\t\t\tvalues[valueIndex + 1] = outcome.Values[valueIndex]
          \t\t\t\t\t\t\tend
          \t\t\t\t\t\tend
          \t\t\t\t\t\tsettledNow = complete(values)
          \t\t\t\t\telse
          \t\t\t\t\t\tlocal reason = outcome.Error and outcome.Error.Message or outcome.CancellationReason or outcome.Status
          \t\t\t\t\t\tsettledNow = fail(self:_MakeTaskError(aggregate, "RACE_WINNER_FAILED", "winner " .. tostring(index) .. " " .. outcome.Status .. ": " .. tostring(reason), {
          \t\t\t\t\t\t\tCause = outcome.Error,
          \t\t\t\t\t\t}))
          \t\t\t\t\tend
          \t\t\t\t\tif settledNow and cancelLosers then
          \t\t\t\t\t\tcancelRemaining(handles, index, "TaskRuntime.race lost")
          \t\t\t\t\tend''', '''\t\t\t\t\tlocal outcome = completedHandle:GetOutcome()
          \t\t\t\t\tlocal beforeFinish = nil
          \t\t\t\t\tif cancelLosers then
          \t\t\t\t\t\tbeforeFinish = function()
          \t\t\t\t\t\t\tcancelRemaining(handles, index, "TaskRuntime.race lost")
          \t\t\t\t\t\tend
          \t\t\t\t\tend
          \t\t\t\t\tif outcome.Success then
          \t\t\t\t\t\tlocal values = { n = (outcome.Values and outcome.Values.n or 0) + 1 }
          \t\t\t\t\t\tvalues[1] = index
          \t\t\t\t\t\tif outcome.Values ~= nil then
          \t\t\t\t\t\t\tfor valueIndex = 1, outcome.Values.n do
          \t\t\t\t\t\t\t\tvalues[valueIndex + 1] = outcome.Values[valueIndex]
          \t\t\t\t\t\t\tend
          \t\t\t\t\t\tend
          \t\t\t\t\t\tcomplete(values, beforeFinish)
          \t\t\t\t\telse
          \t\t\t\t\t\tlocal reason = outcome.Error and outcome.Error.Message or outcome.CancellationReason or outcome.Status
          \t\t\t\t\t\tfail(self:_MakeTaskError(aggregate, "RACE_WINNER_FAILED", "winner " .. tostring(index) .. " " .. outcome.Status .. ": " .. tostring(reason), {
          \t\t\t\t\t\t\tCause = outcome.Error,
          \t\t\t\t\t\t}), beforeFinish)
          \t\t\t\t\tend''', "race cancellation ordering")

          runtime = replace_once(runtime, '''\t\t\t\t\t\tlocal settledNow = complete(values)
          \t\t\t\t\t\tif settledNow and cancelLosers then
          \t\t\t\t\t\t\tcancelRemaining(handles, index, "TaskRuntime.any lost")
          \t\t\t\t\t\tend
          \t\t\t\t\t\treturn''', '''\t\t\t\t\t\tlocal beforeFinish = nil
          \t\t\t\t\t\tif cancelLosers then
          \t\t\t\t\t\t\tbeforeFinish = function()
          \t\t\t\t\t\t\t\tcancelRemaining(handles, index, "TaskRuntime.any lost")
          \t\t\t\t\t\t\tend
          \t\t\t\t\t\tend
          \t\t\t\t\t\tcomplete(values, beforeFinish)
          \t\t\t\t\t\treturn''', "any cancellation ordering")

          runtime_path.write_text(runtime, encoding="utf-8")

          test_path = Path("scripts/tests/task-runtime-test.server.luau")
          test = test_path.read_text(encoding="utf-8")
          test = replace_once(test, '''expectEqual(allResults[2][1], "second", "all should preserve second result")

          local settleSuccessTask''', '''expectEqual(allResults[2][1], "second", "all should preserve second result")

          local allFailure = TaskRuntime.spawn(function()
          \terror("fail fast")
          end)
          local allSlow = TaskRuntime.delay(0.5, function()
          \treturn "too late"
          end)
          local failedAll = TaskRuntime.all({ allFailure, allSlow })
          local failedAllSuccess = failedAll:Await(1)
          expect(not failedAllSuccess, "all should fail when a child fails")
          expectEqual(allSlow.State, "cancelled", "all should cancel unfinished siblings before completing")

          local settleSuccessTask''', "all regression test")

          test = replace_once(test, '''local anySuccessTask = TaskRuntime.delay(0.005, function()
          \treturn "winner"
          end)
          local anyTask = TaskRuntime.any({ anyFailure, anySuccessTask })
          local anySuccess, anyIndex, anyValue = anyTask:Await(1)
          expect(anySuccess and anyIndex == 2 and anyValue == "winner", "any should return the first successful task")''', '''local anySuccessTask = TaskRuntime.delay(0.005, function()
          \treturn "winner"
          end)
          local anySlow = TaskRuntime.delay(0.5, function()
          \treturn "late winner"
          end)
          local anyTask = TaskRuntime.any({ anyFailure, anySuccessTask, anySlow })
          local anySuccess, anyIndex, anyValue = anyTask:Await(1)
          expect(anySuccess and anyIndex == 2 and anyValue == "winner", "any should return the first successful task")
          expectEqual(anySlow.State, "cancelled", "any should cancel losers before completing")''', "any regression test")
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Remove one-time files
        run: |
          rm -f .github/workflows/apply-taskruntime-aggregate-fix.yml
          rm -f .github/workflows/fix-taskruntime-aggregate.yml
          rm -f .github/taskruntime-aggregate-fix.trigger

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix aggregate cancellation ordering"
          git push
